# =====================================================================
# KeyLogger — Local development orchestration
# Brings up PostgreSQL, the FastAPI backend, and the Vite frontend.
# Usage: docker compose up --build
# =====================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: keylogger-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keylogger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-keylogger}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keylogger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: keylogger-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-keylogger}:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/${POSTGRES_DB:-keylogger}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: keylogger-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_WS_BASE_URL: ws://localhost:8000/api
    ports:
      - "5173:5173"
    command: sh -c "npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
